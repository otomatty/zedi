name: Deploy Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout (with retry)
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/checkout@v7.0.0
          attempt_limit: 3
          attempt_delay: 5000
      - uses: ./.github/actions/setup-toolchain
      - name: Build
        run: bun run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_REALTIME_URL: ${{ vars.REALTIME_URL }}
          VITE_POLAR_PRO_MONTHLY_PRODUCT_ID: ${{ vars.POLAR_MONTHLY_ID }}
          VITE_POLAR_PRO_YEARLY_PRODUCT_ID: ${{ vars.POLAR_YEARLY_ID }}
      # Workers Static Assets (#1088 Phase 3)。旧 Pages プロジェクト zedi-dev は
      # カットオーバー完了後に削除する。custom_domain (dev.zedi-note.app) は旧
      # Pages カスタムドメインを外してからでないと deploy が衝突する。
      - name: Deploy Frontend Worker (dev)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --env dev

  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout (with retry)
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/checkout@v7.0.0
          attempt_limit: 3
          attempt_delay: 5000
      - uses: ./.github/actions/setup-toolchain
      - name: Validate admin build env
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "::error::GitHub development variable API_BASE_URL must be set before deploying admin (admin-dev cannot reach the API via same-origin /api)."
            exit 1
          fi
      - name: Install admin dependencies
        working-directory: admin
        run: bun install --frozen-lockfile
      - name: Build Admin
        working-directory: admin
        run: bun run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_MAIN_APP_URL: ${{ vars.MAIN_APP_URL || 'https://dev.zedi-note.app' }}
          VITE_ENV_LABEL: development
      # Workers Static Assets (#1088 Phase 3)。旧 Pages プロジェクト zedi-admin-dev は
      # カットオーバー完了後に削除する。
      - name: Deploy Admin Worker (dev)
        uses: nick-fields/retry@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 60
          command: bunx wrangler deploy --env dev --config admin/wrangler.jsonc
      - name: Upload Wrangler logs (Admin)
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p wrangler-logs-admin-dev
          if [ -d "$HOME/.config/.wrangler/logs" ]; then cp -r "$HOME/.config/.wrangler/logs/"* wrangler-logs-admin-dev/ 2>/dev/null || true; fi
      - name: Upload Wrangler logs (Admin) artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-logs-admin-dev
          path: wrangler-logs-admin-dev/
