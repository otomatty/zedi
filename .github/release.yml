# PR labels determine categories. Unlabeled PRs go into the "*" category, which must come last.
# PR の分類はラベルで決まります。ラベルのない PR は「*」の分類に入り、この分類は必ず最後に置きます。
changelog:
  categories:
    - title: "✨ Features"
      labels:
        - "feat"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
        - "bugfix"
    - title: "⚡ Performance"
      labels:
        - "perf"
        - "performance"
    - title: "🔧 Maintenance"
      labels:
        - "chore"
        - "ci"
        - "refactor"
        - "style"
        - "test"
        - "docs"
        - "dependencies"
    - title: "📦 Other Changes"
      labels:
        - "*"
  exclude:
    labels:
      - "skip-changelog"
