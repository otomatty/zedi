# CodeRabbit configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit
#
# デフォルトブランチと以下のブランチを自動レビューの対象にする。
# Automatically review the default branch and the base branches listed below.
reviews:
  auto_review:
    enabled: true
    base_branches:
      - "main"
      - "release/.*"
      - "feature/.*"
